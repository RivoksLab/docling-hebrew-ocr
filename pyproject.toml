[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-hebrew-ocr"
version = "0.1.0"
description = "Hebrew OCR engine for Docling, backed by paddleocr-hebrew (scans and broken Hebrew text layers)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rivok Labs" }]
keywords = ["docling", "ocr", "hebrew", "rtl", "pdf", "paddleocr"]
classifiers = [
    "Natural Language :: Hebrew",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = [
    "docling>=2.148",
    "paddleocr-hebrew>=0.1.0",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/RivoksLab/docling-hebrew-ocr"
Repository = "https://github.com/RivoksLab/docling-hebrew-ocr"
Issues = "https://github.com/RivoksLab/docling-hebrew-ocr/issues"
Models = "https://huggingface.co/Rivok/paddleocr-hebrew"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."docling"]
docling_hebrew_ocr = "docling_hebrew_ocr.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the OCR models (a minute or more on a CPU)"]
